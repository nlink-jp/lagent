prompt = "Using the tickets MCP server, find the tickets in project BETA whose title mentions timeout and that were created after September 1st, 2026. Answer with their ids."
mcp = true
mcp_server = "tickets"
suite = "mcp-load"
[expect]
min_tool_calls = 2
[[expect.answer]]
regex = 'BETA-8\b'
[[expect.answer]]
regex = 'BETA-11\b'
