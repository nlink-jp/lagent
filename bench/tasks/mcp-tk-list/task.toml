prompt = "Using the tickets MCP server, list the open tickets of priority high in project ALPHA, newest first, at most two. Answer with their ids."
mcp = true
mcp_server = "tickets"
suite = "mcp-load"
[expect]
min_tool_calls = 2
[[expect.answer]]
regex = 'ALPHA-17\b'
[[expect.answer]]
regex = 'ALPHA-12\b'
