prompt = "Using the tickets MCP server, create a ticket in project BETA titled \"Rotate the signing key\" with priority critical, the labels security and ops, due on November 30, 2026. Answer with the new ticket's id."
mcp = true
mcp_server = "tickets"
suite = "mcp-load"
[expect]
min_tool_calls = 2
[[expect.answer]]
regex = 'BETA-606\b'
